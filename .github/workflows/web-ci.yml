name: StayPilot web CI

on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck TypeScript helpers
        run: npm run typecheck
      - name: Build dashboard, sign-in and public inquiry pages
        run: npm run build
      - name: Preserve generated lockfile for review until it is committed
        uses: actions/upload-artifact@v4
        with:
          name: staypilot-web-package-lockfile
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
