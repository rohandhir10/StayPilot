name: StayPilot API CI

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/staypilot_test
      CLERK_PUBLISHABLE_KEY: pk_test_staypilot_ci
      CLERK_SECRET_KEY: sk_test_staypilot_ci
      OWNER_CLERK_USER_ID: user_staypilot_ci_owner
      WEB_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfile generation remains follow-up work until a generated lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply schema migrations concurrently to exercise deployment locking
        run: |
          npm run migrate &
          first=$!
          npm run migrate &
          second=$!
          wait "$first"
          wait "$second"
      - name: Verify migration ledger and schema version
        run: node --input-type=module -e "import pg from 'pg'; const db=new pg.Pool({connectionString:process.env.DATABASE_URL}); const r=await db.query('SELECT name FROM schema_migrations ORDER BY name'); console.log(r.rows); if(!r.rows.some(x=>x.name==='0002_workspace_integrity.sql')) process.exitCode=1; await db.end();"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
